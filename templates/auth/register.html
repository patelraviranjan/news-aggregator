{% extends "layout/base.html" %}
{% block title %}Register — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap" data-aos="zoom-in">
  <div class="auth-card">
    <h2 class="fw-bold gradient-text mb-3"><i class="bi bi-stars"></i> Join News Aggregator</h2>
    <p class="text-muted">Save articles, build a personalised feed, never miss a story.</p>
    <form method="post" class="mt-3" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Username</label>
      <input name="username" class="form-control form-control-lg rounded-pill" required>
      <label class="form-label mt-3">Email</label>
      <input type="email" name="email" class="form-control form-control-lg rounded-pill" required>
      <div class="row g-3 mt-1">
        <div class="col-md-6"><label class="form-label">Password</label><input type="password" name="password" class="form-control form-control-lg rounded-pill" required></div>
        <div class="col-md-6"><label class="form-label">Confirm</label><input type="password" name="confirm" class="form-control form-control-lg rounded-pill" required></div>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-md-6"><label class="form-label">Phone number <span class="text-danger">*</span></label><input type="tel" name="phone" class="form-control form-control-lg rounded-pill" placeholder="+1 555 000 0000" required></div>
        <div class="col-md-6"><label class="form-label">Country <span class="text-danger">*</span></label><input name="country" class="form-control form-control-lg rounded-pill" required></div>
      </div>
      <label class="form-label mt-3">Address <span class="text-danger">*</span></label>
      <input name="address" class="form-control form-control-lg rounded-pill" placeholder="Street, city, state, ZIP" required>
      <label class="form-label mt-3">Profile image <span class="text-danger">*</span></label>
      <input type="file" name="avatar" accept="image/*" class="form-control form-control-lg rounded-pill" required>
      <button class="btn btn-primary btn-lg rounded-pill w-100 mt-4"><i class="bi bi-rocket-takeoff"></i> Create my account</button>
    </form>
    <p class="text-center text-muted mt-3 mb-0">Already a member? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
