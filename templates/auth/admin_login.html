{% extends "layout/base.html" %}
{% block title %}Admin login — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap" data-aos="zoom-in">
  <div class="auth-card border-danger" style="border-top:6px solid #ef4444">
    <h2 class="fw-bold text-danger"><i class="bi bi-shield-lock"></i> Admin Panel</h2>
    <p class="text-muted">Restricted area. All access is logged.</p>
    <form method="post" class="mt-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Admin email</label>
      <input type="email" name="email" class="form-control form-control-lg rounded-pill" required autofocus>
      <label class="form-label mt-3">Password</label>
      <input type="password" name="password" class="form-control form-control-lg rounded-pill" required>
      <button class="btn btn-danger btn-lg rounded-pill w-100 mt-4"><i class="bi bi-key-fill"></i> Login as Admin</button>
    </form>
    <p class="text-muted small mt-3">Default seed: <code>patelbhai0096@gmail.com</code> / <code>Admin@123</code> — change in production.</p>
  </div>
</div>
{% endblock %}
