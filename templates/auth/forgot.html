{% extends "layout/base.html" %}
{% block title %}Forgot password — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap" data-aos="zoom-in">
  <div class="auth-card">
    <h2 class="fw-bold gradient-text"><i class="bi bi-key"></i> Reset password</h2>
    <p class="text-muted">Enter your email and we will send a reset link.</p>
    <form method="post" class="mt-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="email" name="email" class="form-control form-control-lg rounded-pill" required>
      <button class="btn btn-primary btn-lg rounded-pill w-100 mt-4"><i class="bi bi-envelope"></i> Send recovery email</button>
    </form>
  </div>
</div>
{% endblock %}
