{% extends "layout/base.html" %}
{% block title %}404 — {{ site_name }}{% endblock %}
{% block content %}
<section class="empty-state" data-aos="zoom-in">
  <i class="bi bi-compass display-1 text-warning"></i>
  <h1 class="display-3 fw-bold gradient-text">Lost the story?</h1>
  <p class="lead text-muted">The page you're looking for moved, expired or never existed. Let’s get you back to the headlines.</p>
  <a class="btn btn-primary btn-lg rounded-pill" href="{{ url_for('public.home') }}"><i class="bi bi-house"></i> Back to Home</a>
</section>
{% endblock %}
